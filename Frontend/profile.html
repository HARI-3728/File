<html lang="en">
<head>
	<title>Profile</title>
	<style>
		* {
			box-sizing: border-box;
		}
		body {
			font-family: 'Segoe UI', Arial, sans-serif;
			background-color: #f4f6f8;
			margin: 0;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		.con {
			width: 320px;
			padding: 40px 32px;
			background-color: #ffffff;
			border-radius: 12px;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
		}
		.con h1 {
			text-align: center;
			font-size: 24px;
			color: #1a1a1a;
			margin: 0 0 24px;
		}
		label {
			display: block;
			font-size: 13px;
			font-weight: 600;
			color: #555;
			margin-bottom: 6px;
		}
		input {
			width: 100%;
			padding: 10px 12px;
			margin-bottom: 18px;
			border: 1px solid #ccc;
			border-radius: 6px;
			font-size: 14px;
			transition: border-color 0.2s;
		}
		input:focus {
			outline: none;
			border-color: #4a90e2;
			box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
		}
		input[readonly] {
			background-color: #f0f0f0;
			color: #777;
		}
		.btn-row {
			display: flex;
			gap: 10px;
		}
		button {
			flex: 1;
			padding: 10px;
			border: none;
			border-radius: 6px;
			font-size: 15px;
			font-weight: 600;
			cursor: pointer;
			transition: background-color 0.2s;
		}
		button[value="update"] {
			background-color: #4a90e2;
			color: #fff;
		}
		button[value="update"]:hover {
			background-color: #3a7bc8;
		}
		button[value="delete"] {
			background-color: #f4f4f4;
			color: #d9534f;
			border: 1px solid #d9534f;
		}
		button[value="delete"]:hover {
			background-color: #d9534f;
			color: #fff;
		}
		#profileMessage {
			text-align: center;
			font-size: 13px;
			color: #d9534f;
			min-height: 16px;
			margin: 12px 0 0;
		}
		.logout-link {
			text-align: center;
			margin-top: 16px;
			font-size: 13px;
		}
		.logout-link a {
			color: #4a90e2;
			text-decoration: none;
		}
		.logout-link a:hover {
			text-decoration: underline;
		}
	</style>
</head>
<body>
	<div class="con">
		<h1>Profile</h1>
		<form id="profileForm">
			<label for="name">Name</label>
			<input type="text" id="name" name="name" required>

			<label for="Id">Id</label>
			<input type="text" id="Id" name="Id" readonly>

			<label for="psw">Password</label>
			<input type="password" id="psw" name="psw" placeholder="Leave blank to keep current password">

			<div class="btn-row">
				<button type="submit" value="update">Update</button>
				<button type="submit" value="delete">Delete</button>
			</div>

			<p id="profileMessage"></p>

			<div class="logout-link">
				<a href="login.html">Log Out</a>
			</div>
		</form>
	</div>
	<script src="profile.js"></script>
</body>
</html>
